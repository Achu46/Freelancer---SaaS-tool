services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://clinicos:clinicos@postgres:5432/clinicos
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-access-secret
      JWT_REFRESH_SECRET: local-refresh-secret
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicos
      POSTGRES_PASSWORD: clinicos
      POSTGRES_DB: clinicos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
